<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form & Frame — Studio Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet"><style>
:root{--ink:#191918;--paper:#efede7;--clay:#b86a3b;--line:#d6d3cc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}.top{padding:25px 4vw;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:700;letter-spacing:-.6px}.brand i{font-family:'Libre Baskerville';font-weight:400;color:var(--clay)}.tag{font:10px 'DM Mono';letter-spacing:1.2px;color:var(--clay)}main{max-width:1320px;margin:auto;padding:70px 4vw}h1{font:400 clamp(36px,5vw,70px)/1 'Libre Baskerville';letter-spacing:-3px;margin:12px 0 40px}.login{display:flex;gap:8px;max-width:460px}.login input{flex:1;border:1px solid var(--line);background:#fff;padding:13px}.login button{border:0;background:var(--ink);color:#fff;padding:0 18px;font:10px 'DM Mono';letter-spacing:1px}.error{display:none;color:#a03922;font-size:13px;margin-top:12px}.dashboard{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 40px}.stat{background:#fff;padding:24px;border-top:3px solid var(--clay)}.stat b{display:block;font:400 40px 'Libre Baskerville'}.stat span{font:10px 'DM Mono';letter-spacing:1px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}.panel{background:#fff;border:1px solid var(--line)}.panel h2{font:600 13px 'DM Sans';margin:0;padding:17px;border-bottom:1px solid var(--line)}.item{padding:15px 17px;border-bottom:1px solid #ece9e2}.item:last-child{border-bottom:0}.item b{font-size:13px}.item p{font-size:12px;line-height:1.5;margin:5px 0;color:#5e5b55}.item time{font:10px 'DM Mono';color:#8b877e}.empty{padding:26px 17px;color:#77736b;font-size:13px}@media(max-width:760px){main{padding-top:45px}.stats,.grid{grid-template-columns:1fr}.top{padding:20px}.login{flex-direction:column}.login button{padding:13px}}
</style></head><body><header class="top"><div class="brand">FORM <i>&</i> FRAME</div><span class="tag">STUDIO ADMIN · LOCAL</span></header><main><div id="gate"><div class="tag">Private workspace</div><h1>Today at the studio.</h1><div class="login"><input id="token" type="password" placeholder="Admin token"><button id="enter">UNLOCK</button></div><div class="error" id="error">That token could not unlock the workspace.</div></div><section class="dashboard" id="dashboard"><div class="tag">Live overview</div><h1>Studio activity.</h1><div class="stats"><article class="stat"><b id="leadCount">0</b><span>NEW ENQUIRIES</span></article><article class="stat"><b id="conceptCount">0</b><span>SAVED CONCEPTS</span></article><article class="stat"><b id="chatCount">0</b><span>BOT CONVERSATIONS</span></article></div><div class="grid"><section class="panel"><h2>ENQUIRIES</h2><div id="leads"></div></section><section class="panel"><h2>RECENT CHAT QUESTIONS</h2><div id="chats"></div></section></div></section></main><script>
const get=id=>document.getElementById(id);const show=(id,items,render)=>{get(id).innerHTML=items.length?items.slice(0,12).map(render).join(''):'<div class="empty">Nothing here yet.</div>'};get('enter').onclick=async()=>{let token=get('token').value,headers={Authorization:'Bearer '+token};try{let [leads,concepts,chats]=await Promise.all(['/api/admin/enquiries','/api/admin/concepts','/api/admin/chats'].map(x=>fetch(x,{headers}).then(r=>{if(!r.ok)throw Error();return r.json()})));get('gate').style.display='none';get('dashboard').style.display='block';get('leadCount').textContent=leads.length;get('conceptCount').textContent=concepts.length;get('chatCount').textContent=chats.length;show('leads',leads,x=>'<article class="item"><b>'+escapeHtml(x.name||'Unnamed visitor')+'</b><p>'+escapeHtml(x.contact||'No contact')+' · '+escapeHtml(x.postcode||'No postcode')+'</p><p>'+escapeHtml(x.description||'No project description')+'</p><time>'+new Date(x.createdAt).toLocaleString()+'</time></article>');show('chats',chats,x=>'<article class="item"><p>'+escapeHtml(x.message||'')+'</p><time>'+new Date(x.createdAt).toLocaleString()+'</time></article>')}catch{get('error').style.display='block'}};function escapeHtml(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]))}
</script></body></html>
